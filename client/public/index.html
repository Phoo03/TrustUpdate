<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="TrustUpdate – Secure Software Update Verification and Trust Management Platform" />
    <title>TrustUpdate</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background-color: #0f172a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
      #root { min-height: 100vh; width: 100%; display: flex; flex-direction: column; }
    </style>
    <script>
      // Intercept and suppress errors originating from 3rd-party browser extensions (e.g. Urban VPN, IDM, Adblock)
      // Must run in <head> before Webpack dev client attaches its error listener.
      (function() {
        function isExtensionError(err, filename, message) {
          var fullText = [
            filename || '',
            (err && err.stack) || '',
            (err && err.message) || '',
            message || ''
          ].join(' ').toLowerCase();

          return fullText.indexOf('chrome-extension://') !== -1 ||
                 fullText.indexOf('moz-extension://') !== -1 ||
                 fullText.indexOf('eppiocemhmnlbhjplcgkofciiegomcon') !== -1 ||
                 fullText.indexOf('m_id') !== -1;
        }

        window.addEventListener('error', function(event) {
          if (isExtensionError(event.error, event.filename, event.message)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (reason && isExtensionError(reason, '', reason.message || reason.stack)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
